<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Claro Video · CMAF Watch</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
  :root {
    --bg: #050505;
    --panel: #111;
    --border: #282828;
    --text: #fff;
    --muted: #aaa;
    --accent: #DA291C;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 18px;
    background: #000;
    border-bottom: 3px solid var(--accent);
  }
  .brand {
    display: grid;
    line-height: 0.78;
    letter-spacing: 0;
  }
  .brand .claro { color: var(--accent); font-size: 34px; font-weight: 900; }
  .brand .video { color: #fff; font-size: 28px; font-weight: 850; padding-left: 38px; }
  .tag {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.6px;
    text-align: right;
  }
  main {
    width: min(1100px, 100%);
    margin: 0 auto;
    padding: 14px;
  }
  .player-shell {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  video {
    width: 100%;
    aspect-ratio: 16 / 9;
    display: block;
    background: #000;
  }
  .meta {
    padding: 12px 14px;
    display: grid;
    gap: 6px;
  }
  h1 { margin: 0; font-size: 18px; font-weight: 650; }
  p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
  .status {
    margin-top: 8px;
    padding: 9px 10px;
    background: #050505;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-family: "Consolas", monospace;
    font-size: 12px;
    word-break: break-word;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 14px 14px;
  }
  button, a.button {
    appearance: none;
    border: 1px solid var(--border);
    background: #202020;
    color: var(--text);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 13px;
    text-decoration: none;
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    font-weight: 700;
  }
</style>
</head>
<body>
<header>
  <div class="brand" aria-label="Claro video">
    <span class="claro">Claro</span>
    <span class="video">video</span>
  </div>
  <div class="tag">CMAF · HLS directo</div>
</header>

<main>
  <div class="player-shell">
    <video id="video" controls autoplay muted playsinline webkit-playsinline preload="auto"></video>
    <div class="meta">
      <h1>CMAF en accion</h1>
      <p>Este acceso abre directamente el player HLS para iPhone/iPad. El video inicia silenciado porque iOS no permite autoplay con audio sin interaccion.</p>
      <div class="status" id="status">cargando stream-cmaf/master.m3u8...</div>
    </div>
    <div class="actions">
      <button class="primary" id="play">Reproducir</button>
      <button id="unmute">Activar audio</button>
      <a class="button" href="./">Ver demo completo</a>
    </div>
  </div>
</main>

<script>
const video = document.getElementById('video');
const statusEl = document.getElementById('status');
const HLS_URL = 'stream-cmaf/master.m3u8';

function setStatus(text) {
  statusEl.textContent = text;
}

function tryPlay() {
  video.muted = true;
  video.play().then(() => {
    setStatus('reproduciendo HLS CMAF · autoplay silencioso');
  }).catch(() => {
    setStatus('listo para reproducir · toca Reproducir si iOS bloqueo autoplay');
  });
}

if (video.canPlayType('application/vnd.apple.mpegurl')) {
  video.src = HLS_URL;
  video.addEventListener('loadedmetadata', tryPlay, { once: true });
  setStatus('Safari/iOS detectado · HLS nativo');
} else if (window.Hls && Hls.isSupported()) {
  const hls = new Hls({ startLevel: 2, capLevelToPlayerSize: false });
  hls.loadSource(HLS_URL);
  hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED, () => {
    const top = hls.levels.length - 1;
    hls.currentLevel = top;
    hls.loadLevel = top;
    setStatus('hls.js listo · 1080p preferido');
    tryPlay();
  });
  hls.on(Hls.Events.FRAG_LOADED, (_, data) => {
    setStatus('segmento descargado · ' + data.frag.url.split('/').slice(-2).join('/'));
  });
} else {
  setStatus('este navegador no soporta HLS ni Media Source Extensions');
}

document.getElementById('play').addEventListener('click', () => {
  tryPlay();
});

document.getElementById('unmute').addEventListener('click', () => {
  video.muted = false;
  video.play();
  setStatus('audio activado por interaccion del usuario');
});
</script>
</body>
</html>
